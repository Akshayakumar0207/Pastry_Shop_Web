services:
  - type: web
    name: patisserie-doree-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: TURSO_URL
        sync: false
      - key: TURSO_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
